<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="alternate icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07070a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Voidflix Manga" />
    <meta name="referrer" content="no-referrer" />

    <title>Voidflix Manga — Read Manga, Manhwa & Light Novels</title>
    <meta name="description" content="Read thousands of manga, manhwa, webtoons, and light novels online for free with Voidflix Manga. Distraction-free reader with automatic progress sync." />

    <!-- OpenGraph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Voidflix Manga — Read Manga, Manhwa & Light Novels" />
    <meta property="og:description" content="Read thousands of manga, manhwa, webtoons, and light novels online with Voidflix Manga." />
    <meta property="og:image" content="/icons/icon-512.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('Voidflix Manga PWA ServiceWorker active:', reg.scope);
          }).catch((err) => {
            console.warn('PWA ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
  </head>
  <body class="bg-carbon-950 text-gray-100 font-sans antialiased min-h-screen selection:bg-brand-500 selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
