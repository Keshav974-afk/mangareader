<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11131a"/>
      <stop offset="50%" stop-color="#0a0b10"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>

    <!-- Bevel Rim Gradient -->
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.3)"/>
      <stop offset="40%" stop-color="rgba(16, 185, 129, 0.6)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)"/>
    </linearGradient>

    <!-- Left Wing Gradient -->
    <linearGradient id="wingLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Right Wing Foreground Gradient -->
    <linearGradient id="wingRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Fold Highlight -->
    <linearGradient id="foldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Central Glow Filter -->
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="32" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="portalAura" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#rim)" stroke-width="8"/>

  <!-- Ambient Portal Aura Glow -->
  <circle cx="256" cy="240" r="180" fill="url(#portalAura)" filter="url(#coreGlow)"/>

  <!-- Dynamic Origami V Emblem (Manga Pages + Cinema Blade) -->
  <g>
    <!-- Left Wing (Deep Manga Page Layer) -->
    <path d="M 120 128 L 200 128 L 256 348 L 188 348 Z" fill="url(#wingLeft)"/>

    <!-- Left Wing Speed Highlight -->
    <path d="M 148 168 L 178 168 L 234 328 L 210 328 Z" fill="#ffffff" opacity="0.25"/>

    <!-- Right Wing (Foreground Luminous Manga Blade with Razor Apex) -->
    <path d="M 324 128 L 392 128 L 256 418 L 188 348 L 256 348 Z" fill="url(#wingRight)" filter="drop-shadow(-8px 10px 16px rgba(0,0,0,0.6))"/>

    <!-- Right Wing Speed Highlight -->
    <path d="M 344 178 L 314 178 L 264 330 L 284 330 Z" fill="#ffffff" opacity="0.3"/>

    <!-- Manga Page Top Corner Fold (Dog-ear folded bookmark) -->
    <path d="M 324 128 L 392 128 L 392 196 Z" fill="url(#foldGrad)" opacity="0.95"/>

    <!-- Core Diamond Portal Spark -->
    <polygon points="256,200 276,236 256,272 236,236" fill="#a7f3d0" filter="url(#coreGlow)"/>
  </g>
</svg>