<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Glow effect -->
  <circle cx="256" cy="240" r="140" fill="#10b981" opacity="0.15" filter="url(#glow)"/>

  <!-- Book Base -->
  <g transform="translate(64, 80) scale(0.75)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Page -->
    <path d="M256 120 C 180 80, 80 80, 40 100 L 40 380 C 80 360, 180 360, 256 400 Z" 
          fill="url(#brandGrad)" opacity="0.95" />
    <!-- Right Page -->
    <path d="M256 120 C 332 80, 432 80, 472 100 L 472 380 C 432 360, 332 360, 256 400 Z" 
          fill="url(#brandGrad)" opacity="0.85" />
    <!-- Spine center shadow -->
    <path d="M256 120 L 256 400" stroke="#047857" stroke-width="6" />

    <!-- Stylized 'V' for Voidflix -->
    <polygon points="256,190 200,320 235,320 256,260 277,320 312,320" fill="url(#redGrad)" filter="url(#glow)"/>
  </g>
</svg>
